name: CI

on:
  pull_request:
    branches: [contrib]
  push:
    branches: [contrib]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-changes:
    name: Detect src changes for mutation testing
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.filter.outputs.should-run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            should-run:
              - .stryker/format-incremental.js
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'stryker.config.*'

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: [mutation-changes]
    strategy:
      matrix:
        node-version: ['24']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run js:lint

      - name: Format check
        run: npm run js:format

      - name: Typecheck
        run: npm run js:typecheck

      - name: Build
        run: npm run js:build

      - name: Unit + integration tests
        run: npm run test:coverage

      - name: Mutation testing
        if: github.event_name == 'push' || needs.mutation-changes.outputs.should-run == 'true'
        run: npm run test:mutation

  docker-build:
    name: Docker build (validation only, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: pimbay/asset-dedup-registry:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync:
    if: github.event_name == 'push'
    needs: [node, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push contrib to Codeberg
        run: |
          git remote add codeberg https://oauth2:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/pimbay-svc/asset-dedup-registry.git
          git fetch codeberg contrib:refs/remotes/codeberg/contrib || true
          git push codeberg HEAD:contrib --force
